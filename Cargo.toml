# Dependencies: no debug info, it is what exhausted memory while compiling.
[profile.dev.package."*"]
opt-level = 1
debug = false

# The Workshop: drawn each frame.
[profile.dev.package.workshop]
opt-level = 3
debug-assertions = false

[profile.dev.package.workshop_base]
