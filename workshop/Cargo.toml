[package]
name = "workshop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Dungeon Workshop: the editor of films, decors, dungeons, boss fights, pictures, sounds and music"
readme = "../README.md"
publish.workspace = true

# Dungeon Workshop: the films', decors' and dungeons' editor, laid out as a
# studio (menus, docked panels, an inspector, a bar of state), simple and
# clean; the engine, the films' language and the decors' tool used as they are.
[dependencies]
assets = { path = "../assets" }
decor = { path = "../decor" }
engine = { path = "../engine" }
film = { path = "../film" }
game = { path = "../game" }
media = { path = "../media" }
shell = { path = "../shell" }
spritecollab = { path = "../spritecollab" }
workshop_base = { path = "../workshop_base" }
workshop_decor = { path = "../workshop_decor" }
workshop_dungeon = { path = "../workshop_dungeon" }
workshop_emulator = { path = "../workshop_emulator" }
workshop_film = { path = "../workshop_film" }
workshop_first = { path = "../workshop_first" }
workshop_game = { path = "../workshop_game" }
workshop_resources = { path = "../workshop_resources" }
workshop_script = { path = "../workshop_script" }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_dock = "0.17"
image.workspace = true

[lints]
workspace = true
