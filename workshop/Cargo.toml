[package]
name = "workshop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "L'Atelier des Donjons : l'éditeur des films, décors, donjons, combats de boss, images, sons et musiques"
readme = "../README.md"
publish.workspace = true

# Dungeon Workshop: the films', decors' and dungeons' editor, laid out as a
# studio (menus, docked panels, an inspector, a bar of state), simple and
# clean; the engine, the films' language and the decors' tool used as they are.
[dependencies]
assets = { path = "../assets" }
decor = { path = "../decor" }
emulator = { path = "../emulator" }
engine = { path = "../engine" }
film = { path = "../film" }
game = { path = "../game" }
media = { path = "../media" }
preview = { path = "../preview" }
rules = { path = "../rules" }
scenes = { path = "../scenes" }
shell = { path = "../shell" }
spritecollab = { path = "../spritecollab" }
stage_view = { path = "../stage_view" }
workshop_base = { path = "../workshop_base" }
workshop_dungeon = { path = "../workshop_dungeon" }
workshop_music = { path = "../workshop_music" }
workshop_picture = { path = "../workshop_picture" }
workshop_sound = { path = "../workshop_sound" }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_dock = "0.17"
image.workspace = true
glam.workspace = true
