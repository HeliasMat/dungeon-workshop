# The mega patch: the community's ROM patches for Explorers of Sky that help
# cutscenes, applied together (`tools/ds/megapatch.py`) into the DS export's
# cached base (`ds_cache.py`), in the order of their dependencies.
#
# Each entry:
#   name      the patch's own name (SkyTemple's id for a built-in)
#   kind      skytemple: a SkyTemple built-in (skytemple_files' Patcher)
#             skypatch:  a SkyTemple patch package, read from a folder (`path`)
#             sp:        a special process (armips source `path`), added to
#                        BALANCE/process.bin after ExtractSPCode; called from a
#                        script with ProcessSpecial(id, a, b), its id told by
#                        megapatch.py and kept in the base's manifest
#             cot:       a c-of-time module (`path`), merged into the ROM's one
#                        c-of-time build (cot_build.py)
#   author, source (where it comes from), licence
#   gives     what it gives cutscenes
#   depends   patches it needs first (SkyTemple's own dependencies are added)
#   regions   the releases it works on as it is here (our ROM: EU)
#   share     yes: its code may go in the shareable .bps (a stated, free licence)
#             no:  no licence stated: used in your own base only
#   default   on: in the base; off: listed, not applied (DW_PATCHES=+Name adds it)
#   tested    ok / broke / not yet: the three reference films played headless
#             with it (watch.py --headless), and what was seen
#   path      a folder or file: tools/ds/community/... (licensed, in the
#             repository) or target/ds/megapatch/community/... (no licence:
#             read from its source by `megapatch.py --fetch`, never committed)
#   params    a SkyTemple patch's parameters
#   notes     for a patch left out (kind "left-out"): why, and what it would take
#
# Overlay 36 (ExtraSpace) is shared by area (https://wiki.skytemple.org/index.php/Extra_Overlay_Areas):
# FixMemorySoftlock 0x780 and 0x1420, AntiSoftlock 0xBC0, the Adex text tags
# theirs; the common area from 0x30F70: Chesyon's skypatches its first 0x54
# bytes, c-of-time from 0x30F70 + 0x100 (cot_build.SKIP) to the end.

# --- The base: what everything else needs ------------------------------------

[[patch]]
name = "ActorAndLevelLoader"
kind = "skytemple"
author = "psy_commando"
source = "SkyTemple built-in (pmd2_asm_mods)"
licence = "GPL-3"
gives = "Actors and levels read from files: the 64 spare actors the films cast their Pokémon as, the decors' spare levels."
regions = "EU, US, JP"
share = "yes"
default = "on"
tested = "ok (the base's own since the fast loop)"

[[patch]]
name = "ExtraSpace"
kind = "skytemple"
author = "Frostbyte"
source = "SkyTemple built-in (EoS-ASM-Hacks)"
licence = "GPL-3"
gives = "Overlay 36: room for the code of the patches below and c-of-time."
regions = "EU, US, JP"
share = "yes"
default = "on"
tested = "ok (group 1: the three films as before)"

